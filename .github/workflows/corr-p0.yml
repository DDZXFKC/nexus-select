name: corr-P0 identity and adapter regressions

on:
  push:
    branches:
      - integration/grok-review
    paths:
      - "tools/cross_shop_corr.py"
      - "tools/cross_shop_corr_adapter.py"
      - "tools/cross_shop_offer_contract.py"
      - "tests/test_cross_shop_corr.py"
      - "tests/test_cross_shop_corr_p0.py"
      - "tests/test_cross_shop_name_aid.py"
      - "tests/test_cross_shop_parity_manifest.py"
      - "tests/test_cross_shop_name_aid_refine.py"
      - "tools/cross_shop_name_aid_owner_report.py"
      - "tests/test_cross_shop_name_aid_owner_report.py"
      - "tools/cross_shop_sku_core_v2.py"
      - "tests/test_cross_shop_sku_core_v2.py"
      - "tests/test_cross_shop_name_note_diagnostic.py"
      - "tools/cross_shop_name_aid_refine.py"
      - "tools/cross_shop_name_note_diagnostic.py"
      - "tools/cross_shop_name_aid.py"
      - "tests/test_cross_shop_offer_contract.py"
      - ".github/workflows/corr-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corr-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Existing identity contract suite
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_offer_contract.py' -v
      - name: Existing corr contract suite
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_corr.py' -v
      - name: GLM P0 guard and adapter suite
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_corr_p0.py' -v
      - name: P1 read-only name assistance
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_name_aid.py' -v
      - name: Manifest source ID normalization gate (§6.1)
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_parity_manifest.py' -v
      - name: Human name candidate narrowing
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_name_aid_refine.py' -v
      - name: P2 diagnostic-only ADV_NAME_NOTE
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_name_note_diagnostic.py' -v
      - name: P1 owner shortlist coverage and no-auto regression
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_name_aid_owner_report.py' -v
      - name: GLM SKU core exact matching v2 contract
        run: python3 -m unittest discover -s tests -p 'test_cross_shop_sku_core_v2.py' -v
