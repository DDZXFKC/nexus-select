name: Inline stock server PHP draft validation
on:
  push:
    branches: [integration/grok-review]
    paths:
      - "tools/ahc-stock-inline-endpoints-staging.php"
      - "tools/stockcheck_sp_join_contract.py"
      - "tools/stockcheck_sp_evidence_adapter.py"
      - "tests/test_stockcheck_sp_evidence_adapter.py"
      - "tests/test_stockcheck_sp_url_coverage.py"
      - "tools/stockcheck_sp_reconcile.py"
      - "tools/sp158_merge_supplier_evidence.py"
      - "tests/test_sp158_two_snapshots_consistent.py"
      - "data/xserver-export/sp158-variation-match-result-2026-11-22.csv"
      - "data/xserver-export/sp158-live-sku-match-2026-11-22.csv"
      - "tests/test_sp158_merge_supplier_evidence.py"
      - "tests/test_stockcheck_sp_reconcile.py"
      - "data/xserver-export/sp-30-source-url-coverage-2026-11-21.csv"
      - "data/xserver-export/supplier-url-evidence-sample-2026-11-21.csv"
      - "tools/stockcheck_owner_price.py"
      - "tests/test_stockcheck_owner_price.py"
      - "tests/test_stockcheck_sp_join_contract.py"
      - "qa/php-tests/stockcheck_inline_endpoint_stub_test.php"
      - "tools/ahc-stock-inline-cart-gate-staging.php"
      - "tools/ahc-stock-sp-evidence-offers-staging.php"
      - "tools/ahc-stock-sp-live-adapter-staging.php"
      - "tools/ahc-stock-sp-pricing-staging.php"
      - "local-snapshot-2026-11-15/mu-plugins/ahc-stock-check-ui.js"
      - "local-snapshot-2026-11-15/mu-plugins/ahc-stock-check-ui.php"
      - "qa/js-tests/stock_check_ui_flow_test.js"
      - "tools/ahc-stock-sp158-owner-bridge-staging.php"
      - "tools/ahc-sp158-staging-loader.php"
      - "tools/ahc-sp-clear-legacy-oos-meta.php"
      - "tests/test_ahc_sp158_owner_bridge.php"
      - "qa/php-tests/stockcheck_sp158_full_chain_stub_test.php"
      - "data/xserver-export/sp158-live-sku-match-2026-11-22.csv"
      - "tests/test_ahc_stock_sp_evidence_offers.php"
      - "tests/test_ahc_stock_sp_live_adapter.php"
      - "tests/test_ahc_stock_sp_pricing.php"
      - "qa/php-tests/stockcheck_sp_chain_stub_test.php"
      - ".github/workflows/stockcheck-inline-php.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax validation
        run: |
          php -l tools/ahc-stock-inline-endpoints-staging.php
          php -l tools/ahc-stock-inline-cart-gate-staging.php
          php -l tools/ahc-stock-sp-evidence-offers-staging.php
          php -l tools/ahc-stock-sp-live-adapter-staging.php
          php -l tools/ahc-stock-sp-pricing-staging.php
          php -l tools/ahc-stock-sp158-owner-bridge-staging.php
          php -l tools/ahc-sp158-staging-loader.php
          php -l tools/ahc-sp-clear-legacy-oos-meta.php
          php -l tests/test_ahc_sp158_owner_bridge.php
          php -l qa/php-tests/stockcheck_sp158_full_chain_stub_test.php
          php -l tests/test_ahc_stock_sp_evidence_offers.php
          php -l tests/test_ahc_stock_sp_live_adapter.php
          php -l tests/test_ahc_stock_sp_pricing.php
          php -l qa/php-tests/stockcheck_sp_chain_stub_test.php
      - name: Ensure no customer email or direct cart activation in staging module
        run: |
          ! grep -E 'wp_mail\(|ahc_stock_check_allow_cart\s*,\s*true' tools/ahc-stock-inline-endpoints-staging.php
      - name: Reject superseded 24-hour shared OOS marker in active modules
        run: |
          ! grep -nE '_ahc_inline_oos_until|ahc_inline_shared_oos_variation|marked_oos' \
            tools/ahc-stock-inline-endpoints-staging.php \
            local-snapshot-2026-11-15/mu-plugins/ahc-stock-check-ui.php \
            local-snapshot-2026-11-15/mu-plugins/ahc-stock-check-ui.js
      - name: Anonymous guest and Woo cart mock integration
        run: php qa/php-tests/stockcheck_inline_endpoint_stub_test.php
      - name: Stock popup cancel, add and non-navigation JS integration
        run: node qa/js-tests/stock_check_ui_flow_test.js
      - name: SP staged PHP live adapter, evidence and pricing tests
        run: |
          php tests/test_ahc_stock_sp_evidence_offers.php
          php tests/test_ahc_stock_sp_live_adapter.php
          php tests/test_ahc_stock_sp_pricing.php
          php tests/test_ahc_sp158_owner_bridge.php
          php qa/php-tests/stockcheck_sp158_full_chain_stub_test.php
          php qa/php-tests/stockcheck_sp_chain_stub_test.php
      - name: SP Woo-to-supplier exact join unit tests
        run: python -m unittest discover -s tests -p 'test_stockcheck_sp_join_contract.py' -v
      - name: Owner-approved price formula regression tests
        run: python -m unittest discover -s tests -p 'test_stockcheck_owner_price.py' -v
      - name: Verify all 33 SP supplier variant evidence matches
        run: python -m unittest discover -s tests -p 'test_stockcheck_sp_evidence_adapter.py' -v
      - name: Validate SP documented URLs and no unsupported verified claims
        run: python -m unittest discover -s tests -p 'test_stockcheck_sp_url_coverage.py' -v
      - name: Test full SP parent export reconciliation and HOLD statuses
        run: python -m unittest discover -s tests -p 'test_stockcheck_sp_reconcile.py' -v
      - name: Verify full SP live evidence and legacy snapshot merge
        run: python -m unittest discover -s tests -p 'test_sp158_merge_supplier_evidence.py' -v
      - name: Independently compare all 1713 official Shopify variant IDs across two evidence snapshots
        run: python -m unittest discover -s tests -p 'test_sp158_two_snapshots_consistent.py' -v
