name: StockCheck Python core
on:
  push:
    branches: [integration/grok-review]
    paths:
      - "tools/stockcheck_core.py"
      - "tests/test_stockcheck_core.py"
      - "tools/stockcheck_inquiry_contract.py"
      - "tests/test_stockcheck_inquiry_contract.py"
      - "tools/stockcheck_inline_price_policy.py"
      - "tests/test_stockcheck_inline_price_policy.py"
      - ".github/workflows/stockcheck-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run simulated-merchant unit tests
        run: python3 -m unittest discover -s tests -p 'test_stockcheck_core.py' -v
      - name: Verify owner popup input contract
        run: python3 -m unittest discover -s tests -p 'test_stockcheck_inquiry_contract.py' -v
      - name: Owner inline cart pricing policy
        run: python3 -m unittest discover -s tests -p 'test_stockcheck_inline_price_policy.py' -v
