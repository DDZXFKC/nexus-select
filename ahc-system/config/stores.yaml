# Store master.
# `ec_platform`: shopify | magento | woocommerce | generic
# `enabled_scrape` / `enabled_buy`: software switches; the compliance module
#   still has the final say (a True here does not override a ToS denial).
# `adapter_class`: optional fully-qualified class overriding the platform default.
#
# Add a new store in three lines - no code changes required.

