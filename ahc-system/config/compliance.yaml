# Compliance policy + manual verdicts.
#
# Manual verdicts OVERRIDE the robots.txt / ToS scan result. Use sparingly and
# always with a written justification. Allowed values:
#   allowed | denied | manual | unknown
#
# The runtime decision for an action = manual_verdict if set != unknown,
# else the scan result. See ahc.compliance.policy.decide().

defaults:
  # When robots.txt or ToS cannot be fetched, default to "manual".
  unreachable_action: manual
  # Global crawl politeness - shared by every adapter.
  rate_limit_rps: 1.0
  request_timeout_sec: 20
  respect_crawl_delay: true
  # Buy automation default: OFF unless explicitly turned on per store.
  allow_buy_automation: false

# Per-store manual verdicts. All entries below default to "manual" because
# we have not yet completed a documented ToS review for any of them. The
# compliance module will refuse to scrape or buy for any store whose
# effective verdict is "manual" or "denied".
